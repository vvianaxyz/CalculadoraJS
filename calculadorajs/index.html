<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">

    <title>Calculadora simples</title>
</head>
<body>
   <div class="calculadora">
  <div class="display">
    <input id="display">
  </div>

  <div class="teclas">
    <button class="acoes" onclick="clearDisplay()">C</button>
    <button class="acoes" onclick="appendNumber('.')">.</button>
    <button class="operador" onclick="appendNumber('%')">%</button>
    <button class="operador" onclick="appendOperation('/')">/</button>

    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button class="operador" onclick="appendOperation('*')">*</button>

    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button class="operador" onclick="appendOperation('-')">-</button>

    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button class="operador" onclick="appendOperation('+')">+</button>

    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber('.')">.</button>
    <button class="igual" onclick="calculate()">=</button>
  </div>
</div> 
<script src="calc.js"></script>

</body>
</html>
